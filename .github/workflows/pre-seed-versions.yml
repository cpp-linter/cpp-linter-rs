name: Pre-seed versions

on:
  workflow_call:
    outputs:
      artifact-name:
        description: >-
          The name of uploaded artifact containing the static-binaries-index.json file.
        value: static-binary-versions

permissions: {}

jobs:
  pre-seed-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Download static binaries index
        run: >-
          curl --fail --silent --show-error --location --retry 3
          --output static-binaries-index.json
          https://cpp-linter.github.io/clang-tools-static-binaries/index.json
      - name: Upload static-binaries-index.json
        uses: actions/upload-artifact@v7
        with:
          name: static-binary-versions
          path: static-binaries-index.json
          if-no-files-found: error
