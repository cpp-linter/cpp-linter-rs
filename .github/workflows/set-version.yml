name: Set release version

# Opens a PR that sets the version of cpp-linter, cpp-linter-py and
# cpp-linter-js. Use it when the next version is not the one release-plz
# derives from commit messages, e.g. to start release candidates
# (2.1.0-rc.1) or to leave them (2.1.0).
# After that PR is merged, the release PR keeps the version and only
# adds the changelog.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The new version, e.g. 2.1.0 or 2.1.0-rc.1
        type: string
        required: true

permissions: {}

jobs:
  set-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |-
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a version like 2.1.0 or 2.1.0-rc.1"
            exit 1
          fi
      # A PR opened with the default GITHUB_TOKEN would not run CI.
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the branch
          permission-pull-requests: write # open the PR
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # needed to push the branch
      - uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
      - name: Install cargo-edit
        run: cargo binstall -y cargo-edit
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open a PR with the new version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |-
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          branch="set-version-${VERSION}"
          git switch -c "${branch}"
          cargo set-version -p cpp-linter -p cpp-linter-py -p cpp-linter-js "${VERSION}"
          .github/sync-node-version.sh
          git commit -am "chore: set version to ${VERSION}"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore: set version to ${VERSION}" \
            --body "Sets cpp-linter, cpp-linter-py and cpp-linter-js to ${VERSION}. Once merged, the release PR keeps this version and adds the changelog."
