# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["cpp-linter", "bindings/python", "bindings/node", "docs", "clang-tools-manager"]
resolver = "2"

[workspace.package]
authors = [
    "Brendan Doherty",
    "Xianpeng Shen",
]
description = "Run clang-format and clang-tidy on a batch of files."
homepage = "https://cpp-linter.github.io/cpp-linter-rs"
license = "MIT"
edition = "2024"
repository = "https://github.com/cpp-linter/cpp-linter-rs"

[profile.release]
lto = true
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
log = { version = "0.4.34", features = ["std"] }
mockito = "1.7.2"
pyo3 = {version = "0.30.1", features = ["extension-module"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "charset"] }
thiserror = "2.0.21"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = "1.53.3"
